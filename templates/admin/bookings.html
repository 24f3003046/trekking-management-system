{% extends "base.html" %}

{% block content %}

<h2>All Bookings</h2>

<table class="table table-dark table-striped">

<tr>

<th>ID</th>

<th>User</th>

<th>Trek</th>

<th>Date</th>

<th>Status</th>

</tr>

{% for booking in bookings %}

<tr>

<td>{{ booking.id }}</td>

<td>{{ booking.user.username }}</td>

<td>{{ booking.trek.name }}</td>

<td>{{ booking.booked_on.strftime("%d-%m-%Y") }}</td>

<td>{{ booking.status }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
