{% extends "base.html" %}

{% block content %}

<h2>Available Treks</h2>

<form method="GET" class="row mb-4">

<div class="col">

<input
type="text"
name="location"
class="form-control"
placeholder="Location">

</div>

<div class="col">

<select
name="difficulty"
class="form-select">

<option value="">All</option>
<option>Easy</option>
<option>Moderate</option>
<option>Hard</option>

</select>

</div>

<div class="col">

<button
class="btn btn-success">

Search

</button>

</div>

</form>

<table class="table table-dark">

<tr>

<th>Name</th>
<th>Location</th>
<th>Difficulty</th>
<th>Price</th>
<th>Slots</th>
<th></th>

</tr>

{% for trek in treks %}

<tr>

<td>{{ trek.name }}</td>

<td>{{ trek.location }}</td>

<td>{{ trek.difficulty }}</td>

<td>₹{{ trek.price }}</td>

<td>{{ trek.available_slots }}</td>

<td>

<a
class="btn btn-success btn-sm"
href="{{ url_for('user.book_trek', id=trek.id) }}">

Book

</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
