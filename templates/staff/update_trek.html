{% extends "base.html" %}

{% block content %}

<h2>

Update Trek

</h2>

<form method="POST">

{{ form.hidden_tag() }}

<div class="mb-3">

{{ form.available_slots.label }}

{{ form.available_slots(class="form-control") }}

</div>

<div class="mb-3">

{{ form.status.label }}

{{ form.status(class="form-select") }}

</div>

{{ form.submit(class="btn btn-success") }}

</form>

{% endblock %}
